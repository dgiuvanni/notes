<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Питание">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Заметки</title>
<style>
:root{--bg:#f3f5f3;--card:#fff;--ink:#1c2321;--muted:#6b7672;--line:#d2d9d5;--accent:#2e6b5b;--bad:#b83a2e}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1a201d;--ink:#e4ebe7;--muted:#8f9b96;--line:#36403b;--accent:#7cc4ab;--bad:#f08a7e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}
input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
p{margin:0;font-size:13px;color:var(--muted);min-height:1em}
p.err{color:var(--bad)}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Вход</h1>
  <input id="k" type="password" placeholder="Ключ" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-label="Ключ">
  <button id="b" type="submit">Войти</button>
  <p id="m"></p>
</form>
<script>
(function(){
var REPO="dgiuvanni/notes-data";
var f=document.getElementById("f"),k=document.getElementById("k"),b=document.getElementById("b"),m=document.getElementById("m");
function get(n){try{return localStorage.getItem(n)}catch(e){return null}}
function put(n,v){try{localStorage.setItem(n,v)}catch(e){}}
function show(t,err){f.hidden=false;m.textContent=t||"";m.className=err?"err":"";k.focus()}
function load(key){
  return fetch("https://api.github.com/repos/"+REPO+"/contents/app.html?t="+Date.now(),{
    headers:{Authorization:"Bearer "+key,Accept:"application/vnd.github.raw+json"},cache:"no-store"
  }).then(function(r){
    if(r.status===401||r.status===403||r.status===404)throw "auth";
    if(!r.ok)throw "net";
    return r.text();
  },function(){throw "net"});
}
function boot(html){document.open();document.write(html);document.close()}
var saved=get("nt.key");
if(saved){
  load(saved).then(function(html){put("nt.app",html);put("nt.repo",REPO);boot(html)})
  .catch(function(e){
    var cached=get("nt.app");
    if(e==="net"&&cached){boot(cached);return}
    if(e==="auth"){try{localStorage.removeItem("nt.key")}catch(x){}show("Ключ больше не действует. Введите новый.",true)}
    else show("Нет связи с GitHub. Проверьте интернет.",true);
  });
}else show("");
f.addEventListener("submit",function(ev){
  ev.preventDefault();
  var key=k.value.trim();if(!key)return;
  b.disabled=true;m.className="";m.textContent="Проверяю…";
  load(key).then(function(html){put("nt.key",key);put("nt.repo",REPO);put("nt.app",html);boot(html)})
  .catch(function(e){b.disabled=false;show(e==="auth"?"Ключ не подходит.":"Нет связи с GitHub. Проверьте интернет.",true)});
});
})();
</script>
</body>
</html>
